name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile source
        run: python -m compileall -q src

      - name: Import analysis modules
        env:
          PYTHONPATH: src
        run: >-
          python -c "import analysis_forms, analysis_names, analysis_pages,
          build_dataset, common, conventions, describe_population,
          figure1_setting, figure2_pages, figure3_names, figure4_forms,
          run_all, style, timeline"
